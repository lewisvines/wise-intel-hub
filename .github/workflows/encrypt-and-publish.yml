name: Publish Hub Source

# The root front door embeds src_index.html. Keep that generated live page aligned
# with the reviewed source while access remains controlled by the WiSE PMM Hub.

on:
  push:
    branches: [main]
    paths:
      - 'src/index.html'
      - '.github/workflows/encrypt-and-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hub-source
  cancel-in-progress: true

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate hub trust gates
        run: npm run validate

      - name: Build the live hub page from source
        run: cp src/index.html src_index.html

      - name: Commit live hub page if it changed
        run: |
          if ! git diff --quiet src_index.html; then
            git config user.name "wise-hub-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src_index.html
            git commit -m "Publish src_index.html from reviewed source [skip ci]"
            git push
          else
            echo "Live hub page unchanged - nothing to publish."
          fi
