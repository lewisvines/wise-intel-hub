name: WiSE Weekly Intelligence Brief

on:
  schedule:
    # Every Monday at 6:30am UTC
    - cron: '30 6 * * 1'
  workflow_dispatch:

jobs:
  generate-weekly-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate weekly brief and send
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          WEEKLY_TO_EMAILS: ${{ secrets.WEEKLY_TO_EMAILS }}
        run: python3 .github/scripts/send_weekly_brief.py
