name: WiSE Daily Intelligence Digest

on:
  push:
    paths:
      - 'signals.json'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # Only run on scanner commits, not manual pushes
    if: contains(github.event.head_commit.message, 'daily signal scan') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Generate and send daily digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
        run: python3 .github/scripts/send_daily_digest.py
